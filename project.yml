name: Levmi
options:
  bundleIdPrefix: de.immodigit
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  xcodeVersion: "26.0"
settings:
  base:
    DEVELOPMENT_TEAM: NVN9F2C593   # ImmoDigit GmbH (Team-ID, nicht Zertifikats-Kennung)
    CODE_SIGN_STYLE: Automatic
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
packages:
  LevmiCore:
    path: Packages/LevmiCore
targets:
  Levmi:
    type: application
    platform: iOS
    sources:
      - path: Levmi
    dependencies:
      - package: LevmiCore
        product: LevmiCore
    info:
      path: Levmi/Info.plist
      properties:
        CFBundleDisplayName: Levmi
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        ITSAppUsesNonExemptEncryption: false
        CADisableMinimumFrameDurationOnPhone: true
        UIRequiredDeviceCapabilities: [arm64, metal]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIUserInterfaceStyle: Dark
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.immodigit.levmi
        PRODUCT_NAME: Levmi
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
  LevmiUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: LevmiUITests
    dependencies:
      - target: Levmi
    settings:
      base:
        SWIFT_VERSION: "5.0"
        TEST_TARGET_NAME: Levmi
schemes:
  Levmi:
    build:
      targets:
        Levmi: all
        LevmiUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - LevmiUITests
        - package: LevmiCore/LevmiCoreTests
    archive:
      config: Release
